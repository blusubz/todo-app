<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TODO APP</title>
    </head>
    <body>
        <div id="container">
            <aside class="sidebar">
                <h1>Projects</h1>
                <button id="addProjectBtn">New Project</button>
                <div id="projectsList"></div>
            </aside>

            <main class="main-content">
                <h1>Welcome to your app that gets things done.</h1>
                <h2>Checklist</h2>
                <div id="todoCards"></div>
            </main>
        </div>

        <!-- The Dialog Box -->
         <dialog id="project-dialog">
            <form method="dialog" id="project-name">
                <!-- method="dialog" allows button with submit to close dialog -->
                <div>
                    <label for="projectName">Project name:</label>
                    <input type="text" id="projectName" name="projectName" autofocus>
                </div>
                <button type="submit" id="closeBtn">Submit</button>
            </form>
         </dialog>
    </body>
</html>
