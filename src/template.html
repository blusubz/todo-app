<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TODO APP</title>
    </head>
    <body>
        <div id="container">
            <aside id="sidebar">
                <h1>Projects</h1>
                <button id="addProjectBtn">New Project</button>
                <div id="projectsList"></div>
            </aside>

            <main id="main-content">
                <h1>Checklist</h1>
                <h2>Welcome to your app that gets things done.</h2>
                <div id="card-container">
                    <!-- <div class="todo-card">
                        <h5>Buy Bacon</h5>
                        <p>Buy bacon for breakfast</p>
                        <p>Priority 1 (Family loves bacon)</p>
                        <p>
                            Note: Buy Colanta brand
                        </p>                        
                        <div class="checklist">
                            <label for="isChecked">
                                Completed
                            </label>
                            <input type="checkbox" id="isChecked" name="isChecked">
                        </div>
                    </div> -->
                </div>
            </main>
        </div>

        <!-- The Project Dialog Box -->
         <dialog id="project-dialog">
            <form method="dialog" id="project-name-form">
                <!-- method="dialog" allows button with submit to close dialog -->
                <div>
                    <label for="projectName-input">
                        Project name:
                    </label>
                    <input type="text" id="projectName-input" name="projectName-input" autofocus>
                </div>
                <button type="submit" id="closeBtn">Submit</button>
            </form>
         </dialog>

        <!-- The Todo Dialog Box -->
         <dialog id="todo-dialog">
            <form method="dialog" id="todo-form">
                <div>
                    <label for="todo-title">Title:</label>
                    <input type="text" id="todo-title" name="todo-title" autofocus>
                </div>
                <div>
                    <label for="todo-description">Description:</label>
                    <input type="text" id="todo-description" name="todo-description">
                </div>
                <div>
                    <label for="todo-priority">Choose Priority:</label>
                    <select name="priority" id="todo-priority">
                        <option value="">--Please select priority--</option>
                        </option>
                        <option value="high">high</option>
                        <option value="medium">medium</option>
                        <option value="low">low</option>
                    </select>
                </div>
                <div>
                    <label for="todo-notes">Notes:</label>
                    <input type="text" id="todo-notes" name="todo-notes">
                </div>
                <div>
                    <label for="check">Completed</label>
                    <input type="checkbox" id="check">
                </div>
                <button type="submit" id="close-todo-btn">Submit</button>
            </form>
         </dialog>
    </body>
</html>
